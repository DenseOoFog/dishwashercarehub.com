name: GSC Fetch and Report

on:
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-auth google-auth-httplib2 google-api-python-client

      - name: Restore service account key from secret
        env:
          SEARCH_CONSOLE_SA_JSON: ${{ secrets.SEARCH_CONSOLE_SA_JSON }}
        run: |
          if [ -z "$SEARCH_CONSOLE_SA_JSON" ]; then
            echo "SEARCH_CONSOLE_SA_JSON is not configured. Add a Search Console service-account JSON repository secret before running this workflow."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/gsc"
          printf "%s" "$SEARCH_CONSOLE_SA_JSON" > "$RUNNER_TEMP/gsc/service-account.json"
          chmod 600 "$RUNNER_TEMP/gsc/service-account.json"

      - name: Run GSC fetcher
        env:
          GSC_CREDENTIALS_FILE: ${{ runner.temp }}/gsc/service-account.json
          GSC_OUTPUT_DIR: Performance
        run: python scripts/gsc_fetch.py

      - name: Upload Performance outputs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: gsc-performance-outputs
          path: Performance/**
