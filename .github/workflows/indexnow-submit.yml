name: IndexNow Submit

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Submit all canonical URLs when manually triggered
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/submit_indexnow.py --submit
      - name: Submit recently modified URLs on the daily schedule
        if: github.event_name == 'schedule'
        run: python scripts/submit_indexnow.py --submit --since-days 2
