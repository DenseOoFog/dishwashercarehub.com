name: Site Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_site.py
      - run: python scripts/audit_content_quality.py
      - run: python scripts/generate_feed.py --check
      - run: python scripts/test_gsc_fetch.py
      - run: python scripts/test_live_site_monitor.py
      - run: python scripts/submit_indexnow.py
      - run: python scripts/test_indexnow.py
      - run: node scripts/test_guide_finder.js
      - run: node scripts/test_water_hardness_converter.js
      - run: node scripts/test_maintenance_planner.js
