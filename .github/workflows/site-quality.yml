name: Site Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: ruby scripts/audit_workflow_yaml.rb
      - run: python scripts/validate_site.py
      - run: python scripts/audit_workflow_security.py
      - run: python scripts/test_workflow_security.py
      - run: python scripts/audit_dependency_lock.py
      - run: python scripts/test_dependency_lock.py
      - run: python scripts/audit_content_quality.py
      - run: python scripts/generate_feed.py --check
      - run: python scripts/test_gsc_fetch.py
      - run: python scripts/test_live_site_monitor.py
      - run: python scripts/submit_indexnow.py
      - run: python scripts/test_indexnow.py
      - run: node scripts/test_guide_finder.js
      - run: node scripts/test_water_hardness_converter.js
      - run: node scripts/test_maintenance_planner.js
      - run: node scripts/test_dishwasher_noise_decoder.js
